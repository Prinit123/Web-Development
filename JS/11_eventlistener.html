<!-- An event listener is a function that waits for a specific event (such as a click, key press, or mouse movement) to happen on an element. When that event occurs, the function is executed. -->

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="para">Click</button>
    <button id="para2">DblClick</button>
    <button id="para3">Mouseover</button>
</body>
<script>
    let para1=document.getElementById('para')
    para1.addEventListener("click",()=>{
        alert("hello!!")
    })
    let para2=document.getElementById('para2')
    para2.addEventListener("dblclick",()=>{
        alert("Good morning!!")
    })
    let para3=document.getElementById('para3')
    para3.addEventListener("mouseover",()=>{
        alert(" hello Good morning!!")
    })
</script>
</html>
