        if(name){
            document.getElementById("output").textContent="Hello, "+ name + "!";
        }
    }

    function ConfirmAction() {

    function showLocationInfo(){
        const loc =location;
        document.getElementById("output").innerHTML =
        `<strong>location Info :</strong><br>
        Href : ${loc.href}<br>
        Hostname : ${loc.hostname}<br>
        Pathname : ${loc.pathname}<br>
        Protocol : ${loc.protocol}`;
    }

    function locationreload(){
        location.reload();
    }

    function goback() {
        history.back();
    }

    function screeninfo(){
        const info = `Screen width: ${screen.width},height: ${screen.height}`;
        document.getElementById("output").textContent = info;
    }

    function showBrowserInfo(){
        const nav = navigator;
        const info = `Browser Info:
        UserAgent: ${nav.userAgent}
        Language: ${nav.onLine}`;
        document.getElementById("output").textContent = info;
    }

// BOM (Browser Object Model) is a collection of objects provided by the web browser that lets JavaScript interact with the browser itself (rather than just the HTML page).
