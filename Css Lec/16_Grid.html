<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .main {
        display: grid;
        grid-template-columns: 100px 200px 300px 400px;
        grid-template-columns: auto auto auto;

        /*gap: 20px;
            column-gap: 50px;
            row-gap: 50px;*/
      }

      .box {
        height: 120px;
        width: 100%;
        border: 2px solid black;
        background-color: orange;
        font-size: xx-large;
      }

      .two {
        height: 100%;
        background-color: crimson;

        /*grid-column: span 2;
        grid-column: span 3;
        grid-row: span 2;*/

        /*grid-column-start: 1;*/
            /*grid-column-end: span 2;*/

          /*grid-row-start: 1;
            grid-row-end: 3;*/

        /*grid-column: 1/3;
            grid-row: 1/3;*/

            /*grid-area: row-start / column-start / row-end / column-end;*/
        grid-area: 2/2/4/4;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="box">1</div>
      <div class="box two">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
      <div class="box">5</div>
      <div class="box">6</div>
      <div class="box">7</div>
      <div class="box">8</div>
      <div class="box">9</div>
    </div>
  </body>
</html>
