<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 120px;
            width: 180px;
            background-color: aqua;

            border: 5px;
            border-color: black;
            border-style: solid;
            border-radius: 15px;
            position:relative;

            animation-name:mybox;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            
        }
        @keyframes mybox {
            0%{
                left:0px;
            }
            100%{
                left: 500px;
                top:0px;
                height: 120px;
                width: 120px;
            }
            
        }
    </style>
</head>
<body>
    <div>

    </div>
</body>
</html>
