<!DOCTYPE html>
<html lang="en">
<head>
           <meta charset="UTF-8">
           <meta name="viewport" content="width=device-width, initial-scale=1.0">
           <title>Document</title>
           <style>
                      .main{
                                 height: 40px;
                                 width: 100%;
                                 background-color: white;
                                 border: 2px black solid;

                                 display: flex;

                                 flex-wrap: wrap;
                                 justify-content:space-around;
                                 align-items: center;

                      }
                      .box{
                                 height: 15px;
                                 width: 30px;
                                 background-color:aqua;
                                 border: 1px black solid;
                                 border-radius: 4px;
                                 padding: 8px 16px;
                                 font-family: sans-serif;
                                 font-size: 14px;
                                 text-align: center;
                      }
                      .a{
                                 height: 12px;
                                 width: 60px;
                      }
                      .b{
                                 height: 12px;
                                 width: 90px;
                      }
                      .c{
                                 height: 12px;
                                 width: 90px;
                      }
           </style>
</head>
<body>
           <div class="main">
                      <div class="box">Home</div>
                      <div class="box a">About Us</div>
                      <div class="box b">Our Products</div>
                      <div class="box c">Contact Us</div>
           </div>
</body>
</html>
