<!DOCTYPE html>
<html lang="en">
<head>
           <meta charset="UTF-8">
           <meta name="viewport" content="width=device-width, initial-scale=1.0">
           <title>Document</title>
           <style>
                      .main{
                                 display:grid;
                                 grid-template-columns: 100px 100px 100px;

                      }
                      .box{
                                 height: 100px;
                                 width: 100px;
                                 background-color: aqua;
                                 border: 2px black solid;
                      }
           </style>
</head>
<body>
           <div class="main">
                      <div class="box">A</div>
                      <div class="box">B</div>
                      <div class="box">C</div>
                      <div class="box">D</div>
                      <div class="box">E</div>
                      <div class="box">F</div>
           </div>
</body>
</html>
