<!DOCTYPE html>
<html lang="en">
<head>
           <meta charset="UTF-8">
           <meta name="viewport" content="width=device-width, initial-scale=1.0">
           <title>Document</title>
           <style>
                      .main{
                                 display: grid;
                                 grid-template-columns: 100px 100px 100px;
                                 grid-gap: 10px;
                                 /* gap: 10px 10px;*/
                      }
                      .box{
                                 height: 120px;
                                 width: 100px;
                                 background-color: aqua;
                                 border: 2px black solid;
                                 font-size: x-large;
                      }
                      .a{
                                 grid-column-start: 2;
                                 grid-column-end: 3;
                                 grid-row-start: 1;
                                 grid-row-end: 2;
                      }
                      .b{
                                 grid-column-start: 2;
                                 grid-column-end: 3;
                                 grid-row-start: 2;
                                 grid-row-end: 3;

                      }
                      .c{
                                 grid-column-start: 3;
                                 grid-column-end: 4;
                                 grid-row-start: 2;
                                 grid-row-end: 3;
                      }
                      .d{
                                 grid-column-start: 1;
                                 grid-column-end: 2;
                                 grid-row-start: 1;
                                 grid-row-end: 2;
                      }
                      .e{
                                 grid-column-start: 1;
                                 grid-column-end: 2;
                                 grid-row-start: 2;
                                 grid-row-end: 3;
                      }
                      .f{
                                 grid-column-start: 3;
                                 grid-column-end: 4;
                                 grid-row-start: 1;
                                 grid-row-end: 2;
                      }
           </style>
</head>
<body>
           <div class="main">
                      <div class="box a">A</div>
                      <div class="box b">B</div>
                      <div class="box c">C</div>
                      <div class="box d">D</div>
                      <div class="box e">E</div>
                      <div class="box f">F</div>
           </div>
</body>
</html>
