<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            height: 120px;
            width: 120px;
            background-color: skyblue;
            background-image: url(./1.jpg);

            clip-path: polygon(50% 0% , 0% 100% , 100% 100%);
        }
    </style>
</head>

<body>
    <div></div>
</body>

</html>
