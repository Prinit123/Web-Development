<!DOCTYPE html>
<html lang="en">
<head>
           <meta charset="UTF-8">
           <meta name="viewport" content="width=device-width, initial-scale=1.0">
           <title>Document</title>
</head>
<body>
           <form onsubmit="return save()">
                      <input type="text" placeholder="entr name" id="name">
                      <input type="password" placeholder="enter passoword" id="pa">
                      <input type="submit" value="submit">
           </form>
</body>
<script>
           function save()
           {
                      const name = document.getElementById("name").value;
                      const pa = document.getElementById("pa").value;

                      if(name==''||pa=='')
                      {
                                 alert("please fill the form");
                                 return false;
                      }
                      else
                      {
                                 alert("form submit successfuly");
                                 return true;
                      }
           }
</script>
</html>
